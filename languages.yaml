de:
  PLUGIN_REDIRECT_MANAGER:
    TITLE: Weiterleitungen
    WIDGET:
      TITLE: Weiterleitungen im Überblick
    PANEL:
      LABEL: Weiterleitungen dieser Seite
    PERMISSIONS:
      GROUP: Weiterleitungen
      READ: Weiterleitungen, 404-Protokoll, Vorschläge und Statistiken ansehen
      MANAGE: Weiterleitungen anlegen, bearbeiten, löschen und importieren, Link-Prüfungen starten sowie 404-Einträge und Vorschläge bearbeiten
    CONFIG:
      TAB_REDIRECTS: Weiterleitungen
      REDIRECTS_ENABLED: Weiterleitungen aktivieren
      REDIRECTS_ENABLED_HELP: 'Aus: Das Plugin leitet Besucher nicht mehr weiter und protokolliert keine 404-Zugriffe mehr. Die gespeicherten Regeln bleiben erhalten.'
      DEFAULT_STATUS: Standard-Statuscode
      DEFAULT_STATUS_HELP: 'Statuscode für neue Regeln: von Hand angelegte, importierte ohne Code und angenommene Vorschläge. „Grav-Systemstandard“ nutzt system.pages.redirect_default_code, in Grav standardmäßig 302. Bestehende Regeln und automatische Weiterleitungen behalten ihren eigenen Code.'
      DEFAULT_STATUS_SYSTEM: Grav-Systemstandard
      KEEP_LANGUAGE_PREFIX: Sprachpräfix beibehalten
      KEEP_LANGUAGE_PREFIX_HELP: 'Wurde die URL mit Sprachpräfix wie /de aufgerufen, erhält ein internes Ziel dasselbe Präfix: /de/alt führt nach /de/neu. Ziele mit eigenem Sprachcode, Ziele mit {lang} und externe Ziele bleiben unverändert.'
      CACHE_CONTROL_PERMANENT: Cache-Control für permanente Weiterleitungen
      CACHE_CONTROL_TEMPORARY: Cache-Control für temporäre Weiterleitungen
      CACHE_CONTROL_HELP: Header-Wert für 301, 308 und 410. Das Feld darunter gilt für 302, 307 und 451. Browser behalten eine permanente Weiterleitung im Cache, bis max-age abläuft, auch wenn Sie die Regel danach ändern oder löschen.
      MAX_CHAIN_DEPTH: Maximale Kettentiefe
      MAX_CHAIN_DEPTH_HELP: 'Höchstzahl Regeln, die für eine Anfrage nacheinander greifen, wenn Regeln „Danach weiter abgleichen“ nutzen. Die Regelprüfung meldet außerdem Weiterleitungsketten und Schleifen, die länger sind. Bereich 1 bis 50.'
      DISABLE_EXPIRED: Abgelaufene Regeln deaktivieren
      DISABLE_EXPIRED_HELP: Der stündliche Wartungsjob deaktiviert Regeln, deren Datum „Läuft ab am“ vorbei ist. Abgelaufene Regeln greifen ohnehin nicht mehr, das räumt nur die Liste auf. Braucht den Grav-Scheduler.
      BASE_URL: Öffentliche Website-URL
      BASE_URL_HELP: 'Stamm-URL der Live-Seite, zum Beispiel https://example.org. Gilt dort, wo keine Besucheranfrage vorliegt: im Scheduler, auf der Kommandozeile und bei Link-Prüfungen aus Admin 2. Daraus entstehen die vollständigen URLs für interne Ziele bei der Link-Prüfung und die Links in der Berichtsmail. Leer: system.custom_base_url, dann die von Grav erkannte URL, zuletzt http://localhost.'
      QUERY_IGNORE: Ignorierte Query-Parameter
      QUERY_IGNORE_HELP: Parameternamen, die beim Vergleich der Anfrage mit dem Query-String einer Regel mit „Exakt abgleichen“ übergangen werden. Groß- und Kleinschreibung spielt keine Rolle, * steht für beliebig viele Zeichen, zum Beispiel utm_*. Regeln mit anderem Query-Modus ignorieren diese Liste. Jede Regel kann eigene Namen ergänzen.
      EXCLUDED_PATHS: Ausgeschlossene Pfade
      EXCLUDED_PATHS_HELP: 'Pfadpräfixe, die das Plugin nie bearbeitet: keine Weiterleitung und kein 404-Protokolleintrag. /shop umfasst /shop und alles darunter, Groß- und Kleinschreibung spielt keine Rolle. Die API-Route, die Admin-2-Route und die Grav-Ordner /user, /system, /vendor, /cache und /logs sind immer ausgeschlossen.'
      TAB_SECURITY: Sicherheit
      ALLOWED_HOSTS: Erlaubte Hosts
      ALLOWED_HOSTS_HELP: Hosts, auf die Regeln bei einem externen Ziel weiterleiten dürfen. example.org erlaubt genau diesen Host. *.example.org erlaubt Subdomains wie www.example.org, aber nicht example.org selbst, deshalb beides eintragen. Eine Regel mit einem anderen externen Host lässt sich nicht speichern, und eine Weiterleitung dorthin wird nie gesendet.
      ALLOW_ANY_EXTERNAL: Beliebiges externes Ziel erlauben
      ALLOW_ANY_EXTERNAL_HELP: Übergeht die Liste der erlaubten Hosts. Wer Weiterleitungen bearbeiten darf, kann dann Besucher auf jede beliebige Website schicken.
      TRUST_PROXY_HEADERS: Proxy-Headern vertrauen
      TRUST_PROXY_HEADERS_HELP: 'Liest Host und Protokoll aus X-Forwarded-Host und X-Forwarded-Proto, die Besucher-IP für das 404-Protokoll aus X-Forwarded-For. Nur aktivieren, wenn ein Reverse-Proxy oder CDN diese Header setzt. Sonst können Besucher sie fälschen: Regeln mit Host- oder Protokollbedingung greifen falsch, und das Protokoll zeigt falsche IPs.'
      REGEX_BACKTRACK_LIMIT: Backtrack-Limit für Regex
      REGEX_BACKTRACK_LIMIT_HELP: Setzt die PHP-Einstellung pcre.backtrack_limit, solange Regeln abgeglichen werden. Braucht eine Wildcard- oder Regex-Regel mehr Schritte, trifft sie diese Anfrage nicht, und der Abgleich läuft mit der nächsten Regel weiter. Ein niedriger Wert stoppt langsame Muster früher, ein hoher erlaubt komplexere. Bereich 1000 bis 1000000.
      TAB_LOG: Protokollierung
      LOG_ENABLED: 404-Zugriffe protokollieren
      LOG_ENABLED_HELP: 'Speichert jede GET- oder HEAD-Anfrage, die mit 404 endet: Pfad, Query-String, Referrer (nur Host und Pfad), User-Agent, Sprache, Host, Zeit und die Besucher-IP nach der Einstellung unten. Werte von Parametern mit sensiblem Namen wie token, password oder email werden durch *** ersetzt. Der 404-Monitor, die Vorschläge und die Berichtsmail lesen dieses Protokoll. Treffer von Weiterleitungen zählt das Plugin getrennt, sie hängen nicht von dieser Einstellung ab.'
      LOG_BACKEND: Protokoll-Speicher
      LOG_BACKEND_HELP: 'JSONL: eine Textdatei pro Tag, ohne Voraussetzungen. SQLite: eine Datenbankdatei, braucht die PHP-Erweiterung pdo_sqlite. Fehlt sie, fällt das Plugin auf JSONL zurück und schreibt eine Warnung ins Grav-Log.'
      LOG_BACKEND_JSONL: JSONL-Dateien
      LOG_BACKEND_SQLITE: SQLite-Datenbank
      RETENTION_DAYS: Aufbewahrungsdauer (Tage)
      RETENTION_DAYS_HELP: 'Der stündliche Wartungsjob löscht 404-Einträge, die älter sind. Braucht den Grav-Scheduler. Bereich 1 bis 365.'
      MAX_SIZE_MB: Maximale Protokollgröße (MB)
      MAX_SIZE_MB_HELP: 'Nur für JSONL. Überschreiben die Tagesdateien zusammen diese Größe, verschwinden die ältesten Tage zuerst, der heutige bleibt. Ein einzelner Tag hört bei 10 MB auf aufzuzeichnen. SQLite hat kein Größenlimit, nur die Aufbewahrungsdauer.'
      LOG_BOTS: Bots protokollieren
      LOG_BOTS_HELP: 'Aus: Zugriffe von Crawlern und Bots, erkannt am User-Agent, werden gar nicht gespeichert. An: Sie werden gespeichert und als Bot markiert. Vorschläge, der Schwellen-Webhook und die Berichtsmail lassen Bots in beiden Fällen außen vor.'
      IP_MODE: Besucher-IP
      IP_MODE_HELP: 'Anonymisieren: setzt das letzte IPv4-Oktett auf 0 (1.2.3.4 wird zu 1.2.3.0) und behält von IPv6-Adressen nur die ersten 48 Bit. Nicht speichern: gar keine IP. Die vollständige Adresse wird nie gespeichert. Hinter einem Proxy zeigt das Protokoll den Besucher nur bei aktivem „Proxy-Headern vertrauen“.'
      IP_MODE_ANONYMIZE: Anonymisieren
      IP_MODE_NONE: Nicht speichern
      USE_DEFAULT_IGNORES: Eingebaute Ignorierliste nutzen
      USE_DEFAULT_IGNORES_HELP: 'Hält typisches Scanner- und Browser-Rauschen aus dem Protokoll: WordPress- und phpMyAdmin-Proben, Skript-URLs wie *.php und *.asp, .env- und .git-Dateien, /favicon.ico und mehr. Ausschalten, wenn Ihre Seite echte .php-URLs hat, die Sie umleiten wollen.'
      IGNORE_PATTERNS: Eigene Ignoriermuster
      IGNORE_PATTERNS_HELP: 'Pfade, die nie protokolliert werden, ein Muster pro Eintrag. * steht für beliebige Zeichen einschließlich /, ? für genau ein Zeichen, Groß- und Kleinschreibung spielt keine Rolle. Das Muster muss auf den ganzen Pfad passen: /old-shop/* trifft /old-shop/a/b, aber nicht /old-shop. Ein Muster mit ? wird auch gegen Pfad und Query geprüft, zum Beispiel /search?q=*.'
      TAB_AUTO: Automatisierung
      AUTO_ENABLED: Weiterleitungen automatisch anlegen
      AUTO_ENABLED_HELP: Legt Regeln an, wenn eine Seite verschoben wird oder einen neuen Slug oder eine neue Route bekommt, und behandelt gelöschte Seiten nach der Einstellung unten. Das gilt für Änderungen in Admin 2, über die REST-API oder MCP, nicht für Dateien, die direkt auf dem Server bearbeitet werden.
      AUTO_STATUS: Statuscode für automatische Weiterleitungen
      AUTO_STATUS_HELP: 'Statuscode der Regeln für verschobene Seiten und für „Zur übergeordneten Seite weiterleiten“. Nur 301, 302, 307 und 308 gelten, alles andere wird zu 301.'
      AUTO_CHILDREN: Unterseiten
      AUTO_CHILDREN_HELP: 'Wenn eine Seite mit Unterseiten verschoben wird: entweder deckt eine Wildcard-Regel (/alt/* nach /neu/$1) alle ab, oder jede Unterseite bekommt eine eigene Regel.'
      AUTO_CHILDREN_WILDCARD: Eine Wildcard-Regel
      AUTO_CHILDREN_EACH: Eine Regel pro Seite
      ON_DELETE: Beim Löschen einer Seite
      ON_DELETE_HELP: 'Was mit den URLs einer gelöschten Seite und ihrer Unterseiten geschieht. Fragen: Die Entscheidung wartet in Admin 2. 410 Gone: Die URLs antworten mit 410. Zur übergeordneten Seite: Die nächste vorhandene übergeordnete Seite wird das Ziel, mit dem oben gesetzten Statuscode. Nichts tun: Es entsteht keine Regel.'
      ON_DELETE_ASK: Fragen
      ON_DELETE_GONE: 410 Gone senden
      ON_DELETE_PARENT: Zur übergeordneten Seite weiterleiten
      ON_DELETE_NEVER: Nichts tun
      SUGGEST_MIN_SCORE: Mindestbewertung für Vorschläge
      SUGGEST_MIN_SCORE_HELP: Ein 404-Pfad bekommt nur dann ein Ziel vorgeschlagen, wenn die beste passende Seite mindestens diese Bewertung erreicht, von 0 (kein Bezug) bis 1 (fast identisch). Die Bewertung ergibt sich aus der Ähnlichkeit von Slug, Route oder Titel der Seite mit dem angefragten Pfad. Niedrigere Werte liefern mehr und schwächere Vorschläge.
      BULK_ACCEPT_SCORE: Bewertung für Sammelannahme
      BULK_ACCEPT_SCORE_HELP: 'Bewertung, bei der der Regler im Reiter „Vorschläge“ beginnt. API und Kommandozeile nutzen sie, wenn eine Sammelannahme keine Bewertung nennt. Bereich 0,5 bis 1.'
      TAB_CHECKS: Link-Prüfung
      CHECKER_ENABLED: Geplante Link-Prüfung ausführen
      CHECKER_ENABLED_HELP: 'Der Scheduler sendet eine HEAD-Anfrage an das Ziel jeder aktiven Regel. Ein Ziel gilt als tot bei Status 400 oder höher, bei Timeout, DNS-, TLS- oder Verbindungsfehler und nach zu vielen Weiterleitungen. Ziele mit Platzhaltern wie $1 werden übersprungen. Aus: Nur der geplante Lauf entfällt, manuelle Prüfungen funktionieren weiter. Braucht den Grav-Scheduler.'
      CHECKER_SCHEDULE: Prüfplan
      CHECKER_SCHEDULE_HELP: 'Cron-Ausdruck, Standard 30 3 * * 0 (sonntags um 03:30 Uhr). Ein ungültiger Ausdruck fällt auf den Standard zurück.'
      CHECKER_TIMEOUT: Timeout pro Anfrage (Sekunden)
      CHECKER_TIMEOUT_HELP: 'Ein Ziel, das in dieser Zeit nicht antwortet, gilt als tot. Bereich 1 bis 30.'
      CHECKER_MAX_PER_RUN: Maximale Prüfungen pro Lauf
      CHECKER_MAX_PER_RUN_HELP: 'Höchstzahl verschiedener Ziel-URLs pro Lauf. Der Rest wird in diesem Lauf nicht geprüft und als begrenzt angezeigt, nie als tot. Bereich 1 bis 10000.'
      CHECKER_EXTERNAL: Externe Ziele prüfen
      CHECKER_EXTERNAL_HELP: 'Aus: Ziele auf anderen Hosts werden nicht angefragt und erscheinen als übersprungen. An: Der Server sendet HEAD-Anfragen an diese Hosts. Hosts, die auf private oder lokale Adressen zeigen, werden nie angefragt.'
      CHECKER_MANUAL_INTERVAL: Pause zwischen manuellen Prüfungen (Sekunden)
      CHECKER_MANUAL_INTERVAL_HELP: Mindestabstand zwischen zwei Link-Prüfungen, die in Admin 2 oder über die API gestartet werden. Kommandozeile und geplanter Lauf ignorieren ihn.
      TAB_NOTIFY: Benachrichtigungen
      WEBHOOK_URL: Webhook-URL
      WEBHOOK_URL_HELP: 'Empfängt einen JSON-POST, wenn ein 404-Pfad die Schwelle unten erreicht und wenn eine Link-Prüfung ein Ziel neu als tot meldet. Änderungen an Regeln lösen nichts aus. Die URL muss https nutzen, http geht nur für localhost. Weiterleitungen werden nicht verfolgt. Leer: keine Webhooks.'
      WEBHOOK_SECRET: Webhook-Secret
      WEBHOOK_SECRET_HELP: Signiert jede Anfrage. Der Header X-Redirect-Manager-Signature enthält sha256= und den HMAC-SHA256 aus Zeitstempel, Punkt und unverändertem Body. Ohne Secret entfällt die Signatur. Die Umgebungsvariable REDIRECT_MANAGER_WEBHOOK_SECRET hat Vorrang und hält das Secret aus der Konfigurationsdatei heraus.
      NOT_FOUND_THRESHOLD: 404-Schwelle
      NOT_FOUND_THRESHOLD_HELP: Ein 404-Pfad löst den Webhook aus, sobald er in den letzten 24 Stunden mindestens so viele Treffer von Nicht-Bots hatte. Der stündliche Job prüft das. Jeder Pfad wird einmal gemeldet, nach 7 Tagen erneut, falls er noch über der Schwelle liegt. Treffer zählen pro Pfad, Query-Strings trennen sie nicht. Braucht eine Webhook-URL.
      NOTIFY_DEAD_TARGETS: Tote Ziele melden
      NOTIFY_DEAD_TARGETS_HELP: 'Sendet den Webhook dead_target, wenn eine geplante Link-Prüfung ein Ziel neu als tot meldet. Jedes Ziel wird einmal gemeldet, und erneut, wenn es sich erholt und wieder ausfällt. Braucht eine Webhook-URL. Die Berichtsmail nennt tote Ziele in jedem Fall.'
      EMAIL_DIGEST: Berichtsmail
      EMAIL_DIGEST_HELP: 'Sendet eine Zusammenfassung an die Adresse unten: häufigste und neue 404-Pfade (ohne Bots), Weiterleitungs-Treffer, meistgenutzte Regeln, offene Vorschläge und tote Ziele. Täglich um 07:00 Uhr oder wöchentlich montags um 07:00 Uhr. Braucht das Grav-E-Mail-Plugin mit funktionierendem Mailer und den Grav-Scheduler.'
      EMAIL_DIGEST_NONE: Aus
      EMAIL_DIGEST_DAILY: Täglich
      EMAIL_DIGEST_WEEKLY: Wöchentlich
      EMAIL_TO: Empfänger der Berichtsmail
      EMAIL_TO_HELP: Adresse, die die Berichtsmail erhält. Ohne Adresse wird nichts gesendet. Absender ist die From-Adresse des E-Mail-Plugins, ist sie leer, diese Adresse.
      STATS_KEEP_DAYS: Tageszähler aufbewahren (Tage)
      STATS_KEEP_DAYS_HELP: 'Treffer von Weiterleitungen werden pro Regel und Tag gezählt. Tageszähler, die älter sind, entfallen. Die Gesamtzahl je Regel und das Datum des letzten Treffers bleiben. Bereich 7 bis 730.'
      STATS_UNUSED_DAYS: Ungenutzt nach (Tagen)
      STATS_UNUSED_DAYS_HELP: Aktive Regeln ohne Treffer in dieser Zeit erhalten das Kennzeichen „Ungenutzt“. Eine Regel, die nie getroffen wurde, zählt, sobald sie älter ist. Der Befehl prune hat eine eigene Option --unused-days (Standard 180).
      IMPORT_MAX_MB: Maximale Importgröße (MB)
      IMPORT_MAX_MB_HELP: Größter Import, den Admin 2, die API und die Kommandozeile annehmen, gemessen am Dateiinhalt. Größere Importe werden abgelehnt, über die API mit HTTP 413.
