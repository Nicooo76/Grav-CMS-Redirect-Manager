en:
  PLUGIN_REDIRECT_MANAGER:
    TITLE: Redirects
    CONFIG:
      TAB_REDIRECTS: Redirects
      REDIRECTS_ENABLED: Enable Redirects
      REDIRECTS_ENABLED_HELP: 'Enable the redirect system to handle all configured redirect rules.'
      DEFAULT_STATUS: 'Default Status Code'
      DEFAULT_STATUS_HELP: 'HTTP status code used for new redirect rules. Set to 0 to use the system default.'
      DEFAULT_STATUS_SYSTEM: 'System Default'
      KEEP_LANGUAGE_PREFIX: 'Keep Language Prefix'
      KEEP_LANGUAGE_PREFIX_HELP: 'Keep the language prefix (/de or /en) when redirecting to internal targets.'
      CACHE_CONTROL_PERMANENT: 'Cache Control (Permanent)'
      CACHE_CONTROL_TEMPORARY: 'Cache Control (Temporary)'
      CACHE_CONTROL_HELP: 'HTTP Cache-Control header value for permanent redirects. Temporary redirects use ''no-store''.'
      MAX_CHAIN_DEPTH: 'Maximum Chain Depth'
      QUERY_IGNORE: 'Ignore Query Parameters'
      QUERY_IGNORE_HELP: 'Query parameters to ignore when matching redirects. Supports wildcards, e.g. utm_*.'
      EXCLUDED_PATHS: 'Excluded Paths'
      EXCLUDED_PATHS_HELP: 'Path prefixes that should never be redirected. API and admin routes are always excluded.'
      TAB_SECURITY: Security
      ALLOWED_HOSTS: 'Allowed Hosts'
      ALLOWED_HOSTS_HELP: 'External hosts allowed as redirect targets, e.g. example.org, *.example.org. Leave empty to restrict external redirects.'
      ALLOW_ANY_EXTERNAL: 'Allow Any External Target'
      ALLOW_ANY_EXTERNAL_HELP: 'Allow redirects to any external URL without checking against allowed hosts.'
      TRUST_PROXY_HEADERS: 'Trust Proxy Headers'
      TRUST_PROXY_HEADERS_HELP: 'Trust X-Forwarded-* headers for host/protocol detection. Only enable behind a trusted proxy.'
      REGEX_BACKTRACK_LIMIT: 'Regex Backtrack Limit'
      REGEX_BACKTRACK_LIMIT_HELP: 'Maximum backtracking steps for regex engines. Prevents catastrophic backtracking attacks.'
      TAB_LOG: Logging
      LOG_ENABLED: 'Enable Logging'
      LOG_ENABLED_HELP: 'Log all redirect and 404 requests.'
      LOG_BACKEND: 'Log Storage'
      LOG_BACKEND_HELP: 'How to store logs: JSONL files or SQLite database (requires PDO SQLite extension).'
      LOG_BACKEND_JSONL: 'JSONL Files'
      LOG_BACKEND_SQLITE: 'SQLite Database'
      RETENTION_DAYS: 'Retention (Days)'
      MAX_SIZE_MB: 'Maximum Size (MB)'
      LOG_BOTS: 'Log Bot Traffic'
      LOG_BOTS_HELP: 'Log requests from recognized crawlers and bots.'
      IP_MODE: 'IP Address Handling'
      IP_MODE_HELP: 'How to record visitor IPs. Full IP addresses are never stored; anonymize masks the last octet (IPv4) or suffix (IPv6).'
      IP_MODE_ANONYMIZE: Anonymize
      IP_MODE_NONE: 'Do Not Store'
      USE_DEFAULT_IGNORES: 'Use Default Ignore Patterns'
      USE_DEFAULT_IGNORES_HELP: 'Automatically ignore common bot patterns and monitoring requests.'
      IGNORE_PATTERNS: 'Custom Ignore Patterns'
      IGNORE_PATTERNS_HELP: 'Paths to exclude from logging, as glob patterns (e.g. /old-shop/*).'
      TAB_AUTO: Automation
      AUTO_ENABLED: 'Enable Auto Redirects'
      AUTO_ENABLED_HELP: 'Automatically create redirects when pages are moved or deleted.'
      AUTO_STATUS: 'Auto Redirect Status'
      AUTO_CHILDREN: 'Handle Child Pages'
      AUTO_CHILDREN_HELP: 'When redirecting a parent page, handle child pages as one wildcard rule or individual rules.'
      AUTO_CHILDREN_WILDCARD: 'One Wildcard Rule'
      AUTO_CHILDREN_EACH: 'Individual Rules'
      ON_DELETE: 'On Page Deletion'
      ON_DELETE_HELP: 'Action to take when a page with redirects is deleted.'
      ON_DELETE_ASK: 'Ask'
      ON_DELETE_GONE: 'Return 410 Gone'
      ON_DELETE_PARENT: 'Redirect to Parent'
      ON_DELETE_NEVER: 'Do Nothing'
      SUGGEST_MIN_SCORE: 'Minimum Suggestion Score'
      SUGGEST_MIN_SCORE_HELP: 'Minimum confidence score (0-1) for suggesting targets to 404 URLs.'
      BULK_ACCEPT_SCORE: 'Bulk Accept Score'
      TAB_CHECKS: 'Link Checker'
      CHECKER_ENABLED: 'Enable Link Checking'
      CHECKER_ENABLED_HELP: 'Periodically check if redirect targets are reachable.'
      CHECKER_SCHEDULE: 'Check Schedule'
      CHECKER_TIMEOUT: 'Timeout (Seconds)'
      CHECKER_MAX_PER_RUN: 'Max Checks Per Run'
      CHECKER_EXTERNAL: 'Check External Links'
      CHECKER_MANUAL_INTERVAL: 'Manual Check Interval (Seconds)'
      CHECKER_MANUAL_INTERVAL_HELP: 'Minimum seconds between manual link checks from the admin panel.'
      TAB_NOTIFY: Notifications
      WEBHOOK_URL: 'Webhook URL'
      WEBHOOK_URL_HELP: 'URL to receive webhooks when redirects are created, modified, or checked. Payload includes redirect rule and status.'
      WEBHOOK_SECRET: 'Webhook Secret'
      WEBHOOK_SECRET_HELP: 'Secret for signing webhook payloads (HMAC-SHA256). The environment variable REDIRECT_MANAGER_WEBHOOK_SECRET takes precedence.'
      NOT_FOUND_THRESHOLD: '404 Notification Threshold'
      NOT_FOUND_THRESHOLD_HELP: 'Send notification after this many 404 requests to the same URL.'
      NOTIFY_DEAD_TARGETS: 'Notify About Dead Targets'
      EMAIL_DIGEST: 'Email Digest'
      EMAIL_DIGEST_HELP: 'Send periodic email summary of activity, dead targets, and unresolved 404s.'
      EMAIL_DIGEST_NONE: 'Disabled'
      EMAIL_DIGEST_DAILY: Daily
      EMAIL_DIGEST_WEEKLY: Weekly
      EMAIL_TO: 'Email Address'
      EMAIL_TO_HELP: 'Recipient email address for digests. Required if digest is enabled.'
      STATS_KEEP_DAYS: 'Statistics Retention (Days)'
    PERMISSIONS:
      GROUP: Redirects
      READ: 'View redirects and logs'
      MANAGE: 'Create and edit redirects'

de:
  PLUGIN_REDIRECT_MANAGER:
    TITLE: Weiterleitungen
    CONFIG:
      TAB_REDIRECTS: Weiterleitungen
      REDIRECTS_ENABLED: Weiterleitungen aktivieren
      REDIRECTS_ENABLED_HELP: 'Aktivieren Sie das Weiterleitungssystem, um alle konfigurierten Regeln zu verarbeiten.'
      DEFAULT_STATUS: 'Standard-Statuscode'
      DEFAULT_STATUS_HELP: 'HTTP-Statuscode für neue Weiterleitungsregeln. Setzen Sie auf 0, um den Systemstandard zu verwenden.'
      DEFAULT_STATUS_SYSTEM: 'Systemstandard'
      KEEP_LANGUAGE_PREFIX: 'Sprachpräfix beibehalten'
      KEEP_LANGUAGE_PREFIX_HELP: 'Das Sprachpräfix (/de oder /en) beim Umleiten zu internen Zielen beibehalten.'
      CACHE_CONTROL_PERMANENT: 'Cache-Control (permanent)'
      CACHE_CONTROL_TEMPORARY: 'Cache-Control (temporär)'
      CACHE_CONTROL_HELP: 'HTTP Cache-Control-Header für permanente Weiterleitungen. Temporäre Weiterleitungen verwenden ''no-store''.'
      MAX_CHAIN_DEPTH: 'Maximale Kettentiefe'
      QUERY_IGNORE: 'Abfrageparameter ignorieren'
      QUERY_IGNORE_HELP: 'Abfrageparameter, die beim Abgleich von Weiterleitungen ignoriert werden. Unterstützt Platzhalter, z. B. utm_*.'
      EXCLUDED_PATHS: 'Ausgeschlossene Pfade'
      EXCLUDED_PATHS_HELP: 'Pfadpräfixe, die niemals umgeleitet werden sollen. API- und Admin-Routen sind immer ausgeschlossen.'
      TAB_SECURITY: Sicherheit
      ALLOWED_HOSTS: 'Zulässige Host'
      ALLOWED_HOSTS_HELP: 'Externe Host, die als Weiterleitungsziele zulässig sind, z. B. example.org, *.example.org. Leer lassen, um externe Weiterleitungen zu beschränken.'
      ALLOW_ANY_EXTERNAL: 'Beliebiges externes Ziel zulassen'
      ALLOW_ANY_EXTERNAL_HELP: 'Weiterleitungen zu beliebigen externen URLs zulassen, ohne die zulässigen Host zu überprüfen.'
      TRUST_PROXY_HEADERS: 'Proxy-Header vertrauen'
      TRUST_PROXY_HEADERS_HELP: 'X-Forwarded-*-Header für Host-/Protokoll-Erkennung vertrauen. Nur hinter einem vertrauenswürdigen Proxy aktivieren.'
      REGEX_BACKTRACK_LIMIT: 'Regex-Backtracking-Limit'
      REGEX_BACKTRACK_LIMIT_HELP: 'Maximale Backtracking-Schritte für Regex-Engines. Verhindert katastrophale Backtracking-Angriffe.'
      TAB_LOG: Protokollierung
      LOG_ENABLED: 'Protokollierung aktivieren'
      LOG_ENABLED_HELP: 'Alle Weiterleitungs- und 404-Anfragen protokollieren.'
      LOG_BACKEND: 'Protokollspeicherung'
      LOG_BACKEND_HELP: 'Speichermethode für Protokolle: JSONL-Dateien oder SQLite-Datenbank (erfordert PDO SQLite-Erweiterung).'
      LOG_BACKEND_JSONL: 'JSONL-Dateien'
      LOG_BACKEND_SQLITE: 'SQLite-Datenbank'
      RETENTION_DAYS: 'Aufbewahrungsdauer (Tage)'
      MAX_SIZE_MB: 'Maximale Größe (MB)'
      LOG_BOTS: 'Bot-Zugriffe protokollieren'
      LOG_BOTS_HELP: 'Anfragen von erkannten Crawlern und Bots protokollieren.'
      IP_MODE: 'IP-Adress-Verarbeitung'
      IP_MODE_HELP: 'Wie Besuchter-IPs erfasst werden. Vollständige IP-Adressen werden nie gespeichert; Anonymisierung maskiert die letzte Oktettle (IPv4) oder das Suffix (IPv6).'
      IP_MODE_ANONYMIZE: Anonymisieren
      IP_MODE_NONE: 'Nicht speichern'
      USE_DEFAULT_IGNORES: 'Standardmuster ignorieren verwenden'
      USE_DEFAULT_IGNORES_HELP: 'Automatisch häufige Bot- und Überwachungsanfragen ignorieren.'
      IGNORE_PATTERNS: 'Benutzerdefinierte Ignoranzmuster'
      IGNORE_PATTERNS_HELP: 'Pfade, die von der Protokollierung ausgeschlossen werden sollen, als Globmuster (z. B. /old-shop/*).'
      TAB_AUTO: Automatisierung
      AUTO_ENABLED: 'Automatische Weiterleitungen aktivieren'
      AUTO_ENABLED_HELP: 'Automatisch Weiterleitungen erstellen, wenn Seiten verschoben oder gelöscht werden.'
      AUTO_STATUS: 'Status für automatische Weiterleitungen'
      AUTO_CHILDREN: 'Unterseiten verarbeiten'
      AUTO_CHILDREN_HELP: 'Beim Umleiten einer übergeordneten Seite Unterseiten als eine Platzhalterregel oder einzelne Regeln verarbeiten.'
      AUTO_CHILDREN_WILDCARD: 'Eine Platzhalterregel'
      AUTO_CHILDREN_EACH: 'Einzelne Regeln'
      ON_DELETE: 'Beim Löschen der Seite'
      ON_DELETE_HELP: 'Maßnahmen beim Löschen einer Seite mit Weiterleitungen.'
      ON_DELETE_ASK: 'Fragen'
      ON_DELETE_GONE: '410 Gone zurückgeben'
      ON_DELETE_PARENT: 'Zur übergeordneten Seite umleiten'
      ON_DELETE_NEVER: 'Keine Aktion'
      SUGGEST_MIN_SCORE: 'Minimale Bewertung für Vorschläge'
      SUGGEST_MIN_SCORE_HELP: 'Minimale Konfidenzwerte (0-1) für Vorschläge von Zielen zu 404-URLs.'
      BULK_ACCEPT_SCORE: 'Massenakzeptanz-Bewertung'
      TAB_CHECKS: 'Link-Prüfung'
      CHECKER_ENABLED: 'Link-Überprüfung aktivieren'
      CHECKER_ENABLED_HELP: 'Überprüfen Sie regelmäßig, ob Weiterleitungsziele erreichbar sind.'
      CHECKER_SCHEDULE: 'Überprüfungsplan'
      CHECKER_TIMEOUT: 'Timeout (Sekunden)'
      CHECKER_MAX_PER_RUN: 'Maximale Überprüfungen pro Durchlauf'
      CHECKER_EXTERNAL: 'Externe Links überprüfen'
      CHECKER_MANUAL_INTERVAL: 'Manueller Überprüfungsabstand (Sekunden)'
      CHECKER_MANUAL_INTERVAL_HELP: 'Minimale Sekunden zwischen manuellen Link-Überprüfungen im Admin-Panel.'
      TAB_NOTIFY: Benachrichtigungen
      WEBHOOK_URL: 'Webhook-URL'
      WEBHOOK_URL_HELP: 'URL zum Empfang von Webhooks beim Erstellen, Bearbeiten oder Überprüfen von Weiterleitungen. Die Nutzlast enthält die Weiterleitungsregel und den Status.'
      WEBHOOK_SECRET: 'Webhook-Geheimnis'
      WEBHOOK_SECRET_HELP: 'Geheimnis für die Signierung von Webhook-Nutzlasten (HMAC-SHA256). Die Umgebungsvariable REDIRECT_MANAGER_WEBHOOK_SECRET hat Vorrang.'
      NOT_FOUND_THRESHOLD: '404-Benachrichtigungsschwelle'
      NOT_FOUND_THRESHOLD_HELP: 'Benachrichtigung senden, nachdem diese Anzahl von 404-Anfragen an die gleiche URL gelangt ist.'
      NOTIFY_DEAD_TARGETS: 'Benachrichtigungen über ungültige Ziele'
      EMAIL_DIGEST: 'E-Mail-Zusammenfassung'
      EMAIL_DIGEST_HELP: 'Periodische E-Mail-Zusammenfassung von Aktivität, ungültigen Zielen und ungelösten 404ern senden.'
      EMAIL_DIGEST_NONE: 'Deaktiviert'
      EMAIL_DIGEST_DAILY: Täglich
      EMAIL_DIGEST_WEEKLY: Wöchentlich
      EMAIL_TO: 'E-Mail-Adresse'
      EMAIL_TO_HELP: 'Empfänger-E-Mail-Adresse für Zusammenfassungen. Erforderlich, wenn die Zusammenfassung aktiviert ist.'
      STATS_KEEP_DAYS: 'Aufbewahrungsdauer für Statistiken (Tage)'
    PERMISSIONS:
      GROUP: Weiterleitungen
      READ: 'Weiterleitungen und Protokolle anzeigen'
      MANAGE: 'Weiterleitungen erstellen und bearbeiten'
