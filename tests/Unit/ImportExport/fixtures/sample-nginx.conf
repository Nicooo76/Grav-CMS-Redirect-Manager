# Site config with redirects
map $uri $legacy { /x /y; }

server {
    listen 80;
    server_name example.com www.example.com;
    root /var/www/html;
    index index.php;

    # exact
    location = /alt {
        return 301 /neu;
    }
    location = /entfernt {
        return 410;
    }
    location = /kurz {
        return https://www.example.com/lang;
    }

    # regex, case sensitive and insensitive
    location ~ ^/produkte/(\d+)$ {
        return 301 /shop/artikel-$1;
    }
    location ~* ^/News/(?<slug>[^/]+)$ {
        return 302 /aktuelles/$slug;
    }

    # prefix
    location ^~ /docs/ {
        return 301 /dokumentation/;
    }

    # exact query params through $args
    location = /suche {
        return 301 /finden$is_args$args;
    }

    location = /form {
        if ($http_user_agent ~* "bot|spider") {
            return 301 /bot-form;
        }
    }

    location = /promo {
        if ($host = shop.example.com) {
            return 302 /shop-promo;
        }
    }

    location = /marke {
        if ($arg_brand = acme) {
            return 301 /marken/acme;
        }
    }

    location = /geheim {
        if ($request_method = POST) {
            return 405;
        }
    }

    location = /oldsite {
        return 301 https://$host/new$request_uri;
    }

    location ~ "^/(?<year>\d{4})/(?<month>\d{2})/$" {
        rewrite "^/(\d{4})/(\d{2})/$" /archiv/$1-$2 permanent;
    }

    rewrite ^/weiterleitung$ /ziel redirect;
    rewrite ^/intern$ /index.php last;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}

server {
    server_name alt.example.org;
    return 301 https://neu.example.org$request_uri;
}

server {
    listen 80 default_server;
    return 301 https://example.com$request_uri;
}
