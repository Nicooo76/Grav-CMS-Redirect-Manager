# Redirect Manager language file.
# Hand-written sections: TITLE, WIDGET, PANEL, PERMISSIONS, CONFIG, FRONTEND, IMPORT, VALIDATION.
# The UI section is generated by `npm run i18n` (admin2/) from admin2/src/i18n. Do not edit it by hand.
en:
  PLUGIN_REDIRECT_MANAGER:
    TITLE: Redirects
    WIDGET:
      TITLE: Redirects overview
    PANEL:
      LABEL: Redirects for this page
    PERMISSIONS:
      GROUP: Redirects
      READ: View redirects, the 404 log, suggestions and statistics
      MANAGE: Create, edit, delete and import redirects, run link checks and handle 404 entries and suggestions
    CONFIG:
      TAB_REDIRECTS: Redirects
      REDIRECTS_ENABLED: Enable redirects
      REDIRECTS_ENABLED_HELP: 'Off: the plugin stops redirecting visitors and stops logging 404 requests. Stored rules stay as they are.'
      DEFAULT_STATUS: Default status code
      DEFAULT_STATUS_HELP: 'Status code for new rules: rules you create by hand, imported rules without a code, and accepted suggestions. "Grav system default" uses system.pages.redirect_default_code, which is 302 in stock Grav. Existing rules and automatic redirects keep their own code.'
      DEFAULT_STATUS_SYSTEM: Grav system default
      KEEP_LANGUAGE_PREFIX: Keep language prefix
      KEEP_LANGUAGE_PREFIX_HELP: 'If the visitor used a language prefix such as /de, an internal target gets the same prefix: /de/old leads to /de/new. Targets that already start with a language code, targets that use {lang}, and external targets stay unchanged.'
      CACHE_CONTROL_PERMANENT: Cache-Control for permanent redirects
      CACHE_CONTROL_TEMPORARY: Cache-Control for temporary redirects
      CACHE_CONTROL_HELP: Header value for 301, 308 and 410 responses. The field below covers 302, 307 and 451. Browsers keep a cached permanent redirect until max-age runs out, even after you change or delete the rule.
      MAX_CHAIN_DEPTH: Maximum chain depth
      MAX_CHAIN_DEPTH_HELP: 'Most rules applied to one request when rules use "Continue matching afterwards". The rule check also reports redirect chains and loops longer than this. Range 1 to 50.'
      DISABLE_EXPIRED: Disable expired rules
      DISABLE_EXPIRED_HELP: The hourly maintenance job disables rules whose "Expires at" date has passed. Expired rules never match anyway, so this only tidies the list. Needs the Grav scheduler.
      BASE_URL: Public site URL
      BASE_URL_HELP: 'Root URL of the live site, for example https://example.org. Used where no visitor request exists: the scheduler, the command line and link checks started from Admin 2. It turns internal targets into full URLs for the link check and builds the links in the report mail. Empty: system.custom_base_url, then the URL Grav detects, then http://localhost.'
      QUERY_IGNORE: Ignored query parameters
      QUERY_IGNORE_HELP: Parameter names skipped when a request is compared with the query string of a rule set to "Match exactly". Case does not matter, and * matches any run of characters, for example utm_*. Rules with another query mode ignore this list. Each rule can add its own names.
      EXCLUDED_PATHS: Excluded paths
      EXCLUDED_PATHS_HELP: 'Path prefixes the plugin never handles: no redirect and no 404 log entry. /shop covers /shop and everything below it, case does not matter. The API route, the Admin 2 route and the Grav folders /user, /system, /vendor, /cache and /logs are always excluded.'
      TAB_SECURITY: Security
      ALLOWED_HOSTS: Allowed hosts
      ALLOWED_HOSTS_HELP: Hosts that rules may redirect to when the target is an external URL. example.org allows exactly that host. *.example.org allows subdomains such as www.example.org but not example.org itself, so list both. A rule with any other external host cannot be saved, and a redirect to one is never sent.
      ALLOW_ANY_EXTERNAL: Allow any external target
      ALLOW_ANY_EXTERNAL_HELP: Ignores the allowed hosts list. Anyone who can edit redirects can then send your visitors to any website.
      TRUST_PROXY_HEADERS: Trust proxy headers
      TRUST_PROXY_HEADERS_HELP: 'Reads host and protocol from X-Forwarded-Host and X-Forwarded-Proto, and the visitor IP for the 404 log from X-Forwarded-For. Turn on only behind a reverse proxy or CDN that sets these headers. Otherwise visitors can fake them: rules with a host or protocol condition match wrongly and the log shows false IPs.'
      REGEX_BACKTRACK_LIMIT: Regex backtrack limit
      REGEX_BACKTRACK_LIMIT_HELP: Sets the PHP setting pcre.backtrack_limit while rules are matched. A wildcard or regex rule that needs more steps than this does not match that request, and matching goes on with the next rule. A lower value stops slow patterns sooner, a higher value allows more complex ones. Range 1000 to 1000000.
      TAB_LOG: Logging
      LOG_ENABLED: Log 404 requests
      LOG_ENABLED_HELP: 'Stores every GET or HEAD request that ends in a 404: path, query string, referrer (host and path only), user agent, language, host, time and the visitor IP as set below. Values of parameters that look sensitive, such as token, password or email, are replaced with ***. The 404 monitor, suggestions and the report mail read this log. Redirect hits are counted separately and do not depend on this setting.'
      LOG_BACKEND: Log storage
      LOG_BACKEND_HELP: 'JSONL: one text file per day, no extras needed. SQLite: one database file, needs the PHP extension pdo_sqlite. Without it the plugin falls back to JSONL and writes a warning to the Grav log.'
      LOG_BACKEND_JSONL: JSONL files
      LOG_BACKEND_SQLITE: SQLite database
      RETENTION_DAYS: Keep log entries for (days)
      RETENTION_DAYS_HELP: 'The hourly maintenance job deletes 404 entries older than this. Needs the Grav scheduler. Range 1 to 365.'
      MAX_SIZE_MB: Maximum log size (MB)
      MAX_SIZE_MB_HELP: 'JSONL only. When the day files together exceed this size, the oldest days are deleted first, today stays. A single day stops recording at 10 MB. SQLite has no size limit, only the retention period.'
      LOG_BOTS: Log bots
      LOG_BOTS_HELP: 'Off: requests from crawlers and bots, recognized by user agent, are not stored at all. On: they are stored and marked as bots. Suggestions, the threshold webhook and the report mail leave bots out in both cases.'
      IP_MODE: Visitor IP address
      IP_MODE_HELP: 'Anonymize: sets the last IPv4 octet to 0 (1.2.3.4 becomes 1.2.3.0) and keeps only the first 48 bits of an IPv6 address. Do not store: no IP at all. The full address is never stored. Behind a proxy the log shows the visitor only with "Trust proxy headers" on.'
      IP_MODE_ANONYMIZE: Anonymize
      IP_MODE_NONE: Do not store
      USE_DEFAULT_IGNORES: Use built-in ignore list
      USE_DEFAULT_IGNORES_HELP: 'Keeps typical scanner and browser noise out of the log: WordPress and phpMyAdmin probes, script URLs such as *.php and *.asp, .env and .git files, /favicon.ico and more. Turn it off if your site has real .php URLs you want to migrate.'
      IGNORE_PATTERNS: Custom ignore patterns
      IGNORE_PATTERNS_HELP: 'Paths that are never logged, one pattern per entry. * matches any characters including /, ? matches one character, case does not matter, and the pattern must fit the whole path: /old-shop/* matches /old-shop/a/b but not /old-shop. A pattern with ? is also tried against path and query, for example /search?q=*.'
      TAB_AUTO: Automation
      AUTO_ENABLED: Create redirects automatically
      AUTO_ENABLED_HELP: Creates rules when a page is moved or gets a new slug or route, and handles deleted pages as set below. This works for changes made in Admin 2, through the REST API or MCP, not for files edited on disk.
      AUTO_STATUS: Status code for automatic redirects
      AUTO_STATUS_HELP: 'Status code of rules created for moved pages and for "Redirect to parent page". Only 301, 302, 307 and 308 count, anything else falls back to 301.'
      AUTO_CHILDREN: Child pages
      AUTO_CHILDREN_HELP: 'When a page with child pages moves: one wildcard rule (/old/* to /new/$1) covers all of them, or each child page gets its own rule.'
      AUTO_CHILDREN_WILDCARD: One wildcard rule
      AUTO_CHILDREN_EACH: One rule per page
      ON_DELETE: When a page is deleted
      ON_DELETE_HELP: 'What happens to the URLs of a deleted page and its child pages. Ask: the decision waits in Admin 2. 410 Gone: the URLs answer 410. Redirect to parent page: the nearest existing parent page becomes the target, with the status set above. Do nothing: no rule is created.'
      ON_DELETE_ASK: Ask
      ON_DELETE_GONE: Answer 410 Gone
      ON_DELETE_PARENT: Redirect to parent page
      ON_DELETE_NEVER: Do nothing
      SUGGEST_MIN_SCORE: Minimum suggestion score
      SUGGEST_MIN_SCORE_HELP: A 404 path gets a suggested target only if the best matching page scores at least this much, from 0 (unrelated) to 1 (near identical). The score comes from how similar the page slug, route or title is to the requested path. Lower values give more and weaker suggestions.
      BULK_ACCEPT_SCORE: Bulk accept score
      BULK_ACCEPT_SCORE_HELP: 'Score the slider on the Suggestions tab starts at. The API and the command line use it when a bulk accept names no score. Range 0.5 to 1.'
      TAB_CHECKS: Link checker
      CHECKER_ENABLED: Run scheduled link check
      CHECKER_ENABLED_HELP: 'The scheduler sends a HEAD request to the target of every enabled rule. A target counts as dead on status 400 or higher, on timeout, DNS, TLS or connection errors, and after too many redirects. Targets with placeholders such as $1 are skipped. Off: only the scheduled run stops, manual checks still work. Needs the Grav scheduler.'
      CHECKER_SCHEDULE: Check schedule
      CHECKER_SCHEDULE_HELP: 'Cron expression, default 30 3 * * 0 (Sundays at 03:30). An invalid expression falls back to the default.'
      CHECKER_TIMEOUT: Timeout per request (seconds)
      CHECKER_TIMEOUT_HELP: 'A target that does not answer within this time counts as dead. Range 1 to 30.'
      CHECKER_MAX_PER_RUN: Maximum checks per run
      CHECKER_MAX_PER_RUN_HELP: 'Most distinct target URLs requested in one run. The rest is not checked in that run and is shown as rate limited, never as dead. Range 1 to 10000.'
      CHECKER_EXTERNAL: Check external targets
      CHECKER_EXTERNAL_HELP: 'Off: targets on other hosts are not requested and show as skipped. On: the server sends HEAD requests to those hosts. Hosts that resolve to private or local addresses are never requested.'
      CHECKER_MANUAL_INTERVAL: Pause between manual checks (seconds)
      CHECKER_MANUAL_INTERVAL_HELP: Minimum time between two link checks started in Admin 2 or through the API. The command line and the scheduled run ignore it.
      TAB_NOTIFY: Notifications
      WEBHOOK_URL: Webhook URL
      WEBHOOK_URL_HELP: 'Receives a JSON POST when a 404 path reaches the threshold below and when a link check finds a target newly dead. Changes to rules send nothing. The URL must use https, http works only for localhost. Redirects are not followed. Empty: no webhooks.'
      WEBHOOK_SECRET: Webhook secret
      WEBHOOK_SECRET_HELP: Signs each request. The header X-Redirect-Manager-Signature holds sha256= followed by the HMAC-SHA256 of the timestamp, a dot and the raw body. Without a secret no signature is sent. The environment variable REDIRECT_MANAGER_WEBHOOK_SECRET takes precedence and keeps the secret out of the config file.
      NOT_FOUND_THRESHOLD: 404 threshold
      NOT_FOUND_THRESHOLD_HELP: A 404 path triggers the webhook when it got at least this many hits from non-bot visitors in the last 24 hours. The hourly job checks. Each path is reported once, then again after 7 days if it is still above the threshold. Hits count per path, query strings do not split them. Needs a webhook URL.
      NOTIFY_DEAD_TARGETS: Report dead targets
      NOTIFY_DEAD_TARGETS_HELP: 'Sends the dead_target webhook when a scheduled link check finds a target newly dead. Each target is reported once, and again if it recovers and dies again. Needs a webhook URL. The report mail lists dead targets either way.'
      EMAIL_DIGEST: Report mail
      EMAIL_DIGEST_HELP: 'Sends a summary to the address below: top 404 paths and new 404 paths (bots left out), redirect hits, most used rules, open suggestions and dead targets. Daily at 07:00 or weekly on Mondays at 07:00. Needs the Grav email plugin with a working mailer, and the Grav scheduler.'
      EMAIL_DIGEST_NONE: Off
      EMAIL_DIGEST_DAILY: Daily
      EMAIL_DIGEST_WEEKLY: Weekly
      EMAIL_TO: Report recipient
      EMAIL_TO_HELP: Address that receives the report mail. Without an address nothing is sent. The sender is the From address of the email plugin, or this address if that one is empty.
      STATS_KEEP_DAYS: Keep daily hit counts (days)
      STATS_KEEP_DAYS_HELP: 'Redirect hits are counted per rule and day. Daily counts older than this are dropped. The total per rule and the date of its last hit stay. Range 7 to 730.'
      STATS_UNUSED_DAYS: Unused after (days)
      STATS_UNUSED_DAYS_HELP: Active rules without a hit for this many days get the "Unused" badge. A rule that was never hit counts once it is older than this. The prune command has its own --unused-days option (default 180).
      IMPORT_MAX_MB: Maximum import size (MB)
      IMPORT_MAX_MB_HELP: Largest import that Admin 2, the API and the command line accept, measured on the file content. Larger imports are rejected, via the API with HTTP 413.
    FRONTEND:
      GONE_TITLE: This page was removed
      GONE_TEXT: The page you are looking for is gone for good.
      UNAVAILABLE_TITLE: Unavailable for legal reasons
      UNAVAILABLE_TEXT: This page cannot be shown because of a legal demand.
      HOME_LINK: Go to the home page
    IMPORT:
      ISSUE:
        ALIAS_PASS_THROUGH: A Grav route alias shows the target page under the alias URL and does not redirect. A 301 redirect is usually the better choice.
        BINARY_CONTENT: The file is not a text file.
        BLOCK_IGNORED: The directives inside the block "{block}" were ignored.
        DIRECTIVE_IGNORED: The directive "{directive}" is not a redirect and was ignored.
        EMPTY_FILE: The file is empty.
        ENCODING_CONVERTED: The file was converted from {from} to UTF-8.
        FILE_TOO_LARGE: The file is larger than the import limit.
        FILE_UNREADABLE: The file could not be read.
        FORBIDDEN_NOT_SUPPORTED: Rules that answer 403 (flag F) are not supported and were skipped.
        FORMAT_NOT_IMPORTABLE: This format can only be exported, not imported.
        FRAGMENT_REMOVED: 'The #fragment of the source was removed. Servers never see it.'
        GRAV_PREFIX_SEMANTICS: Grav matches this pattern as a path prefix and replaces only the matched part. The imported rule matches the whole path.
        INTERNAL_REWRITE_SKIPPED: An internal rewrite is not a redirect and was skipped.
        INVALID_DATE: The date "{value}" in "{field}" could not be read and was ignored.
        INVALID_JSON: The file is not valid JSON.
        INVALID_LINE: This line could not be read as a redirect.
        INVALID_MATCH_TYPE: The match type "{value}" is not known.
        INVALID_NGINX: 'The nginx config is broken: a block is not closed or a closing brace has no opening one.'
        INVALID_QUERY_MODE: The query mode "{value}" is not known.
        INVALID_REGEX: The regular expression is not valid.
        INVALID_ROW: This entry cannot be read as a rule.
        INVALID_STATUS: The status code "{value}" is not known or not supported.
        INVALID_STRUCTURE: The file does not have the structure this format expects.
        INVALID_TARGET: The target is not valid. It contains spaces or control characters, or it is a relative path with dot segments.
        INVALID_TARGET_TYPE: The target type "{value}" is not known.
        INVALID_YAML: The file is not valid YAML.
        LOCATION_IGNORED: Named or empty locations are not redirects and were ignored.
        MISSING_COLUMN: 'A required column is missing: {field}.'
        MISSING_SOURCE: The source is empty.
        MISSING_TARGET: The target is empty.
        NEGATED_PATTERN: Negated patterns are not supported. The rule was skipped.
        NO_DIRECTIVES: 'The file has no directives this format understands. Did you pick the right format?'
        NO_ROWS: The file contains no rules.
        NO_TARGET: The conditional redirect has no target.
        NOT_FROM_SKIPPED: The "otherwise" target of a server match is not supported.
        PARSE_FAILED: The file could not be parsed.
        PROXY_NOT_SUPPORTED: Proxy rules are not supported and were skipped.
        QUERY_CAPTURE_UNSUPPORTED: The target uses the value of the query parameter "{param}". Captured query values are not supported.
        READ_FAILED: The file could not be processed.
        SOURCE_HOST_CONDITION: The host of the source URL ({host}) became a host condition.
        SOURCE_HOST_STRIPPED: The host of the source URL ({host}) was removed.
        SOURCE_QUERY_DROPPED: The query string of the source was ignored because the query mode does not match on it.
        SPLAT_MULTIPLE: Netlify allows one splat. The target uses the first capture.
        STATUS_MAPPED: 303 See Other is not supported and was imported as 302.
        TOO_DEEP: The file is nested too deeply.
        TOO_MANY_ROWS: The file has more rows than the limit of {max}.
        UNANCHORED_PATTERN: The pattern is not anchored with ^ and was imported as written.
        UNCONDITIONAL_REDIRECT: A server-wide redirect without a host condition would redirect every request. It was skipped.
        UNKNOWN_FORMAT: The file format could not be detected.
        UNKNOWN_PLACEHOLDER: The target uses the placeholder {placeholder}, which the source does not define.
        UNSAFE_TARGET: Only http and https targets are allowed.
        UNSUPPORTED_ACTION: The Redirection action "{action}" is not supported and was skipped.
        UNSUPPORTED_CONDITION: A condition is not supported. The importer ignored it or skipped the rule.
        UNSUPPORTED_FLAG: The RewriteRule flag "{flag}" is not supported and was ignored.
        UNSUPPORTED_MATCH_TYPE: The Redirection match type "{match_type}" is not supported and was skipped.
        UNSUPPORTED_STATUS: The status {status} is not a supported redirect status.
        UNSUPPORTED_VARIABLE: The target uses server variables or captures that are not supported.
        UNSUPPORTED_VERSION: The file was written by a newer version of the plugin.
    VALIDATION:
      ANALYSIS_SKIPPED: No sample path could be derived from this pattern, so its redirect chain was not checked.
      CHAIN: 'Redirect chain with {hops} hops: {chain}.'
      CHAIN_INCOMING: 'Another rule redirects here and continues: {chain}.'
      CHAIN_SHORTCUT: Point this rule at {shortcut} directly.
      CHAIN_TOO_DEEP: The redirect chain is longer than the maximum of {max_depth} hops.
      CONDITION_INVALID: A header or cookie condition needs a name.
      CONDITION_REGEX_INVALID: A header or cookie condition has an invalid regular expression. The rule is ignored.
      CONFLICT: Other rules match the same requests with a different target. Only the highest-ranked one applies.
      DATES_INVERTED: The rule expires before or when it becomes active.
      DUPLICATE: An identical rule already exists.
      EXPIRED: The rule has expired and is not applied.
      INVALID_URL: The URL is not valid.
      LOOP: 'Redirect loop: {chain}.'
      NO_CHAIN: This rule is not the start of a chain that can be shortened.
      PASSTHROUGH_EXTERNAL: A pass-through rule serves a page of this site. It cannot point to an external URL.
      REGEX_CATASTROPHIC: The regular expression can take exponential time (catastrophic backtracking) and is not allowed.
      REGEX_INVALID: The regular expression is invalid.
      REGEX_TOO_LONG: The regular expression is too long.
      SELF_REDIRECT: "The target resolves to the rule's own source: {chain}."
      SELF_REDIRECT_CASE: "The target differs from the source only in letter case ({chain}). A case-insensitive rule matches its own target and would loop. Make the rule case-sensitive."
      SHADOWED: A higher-ranked rule matches this source first, so this rule never applies.
      SOURCE_EMPTY: The source is empty.
      SOURCE_INVALID: The source must be a path such as /old-page, not a full URL, and it must be a valid path.
      TARGET_EMPTY: The target is empty.
      TARGET_HOST_NOT_ALLOWED: The target host is not in the list of allowed external hosts.
      TARGET_INVALID: The target is not valid.
      TARGET_NOT_ALLOWED_FOR_STATUS: A rule with status {status} has no target. The target is ignored.
      TARGET_PLACEHOLDER_UNKNOWN: The placeholder {placeholder} does not refer to a capture of the source. The source has {groups}.
      TARGET_PROTOCOL_RELATIVE: A target starting with // or /\ would redirect to another site.
      TARGET_REQUIRED: This status needs a target.
      TARGET_SCHEME: The target uses a scheme that is not allowed. Only http and https work.
      TOO_BROAD: This pattern would match every path.
